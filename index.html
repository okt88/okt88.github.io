
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bilibili Playlist</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 30px;
    background: #1b1b1b;
    font-size: 26px;
    font-weight: bold;
}

.container {
    padding: 24px;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    margin-bottom: 30px;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

h2 {
    margin-bottom: 20px;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
}

.video-card {
    cursor: pointer;
    min-width: 0;
}

.thumbnail {
    aspect-ratio: 16 / 9;
    background: #333;
    border-radius: 8px;
    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


.video-card:hover .thumbnail,
.video-card:focus .thumbnail {
    outline: 3px solid #00aeec;
}

.video-title {
    margin-top: 10px;
    font-size: 16px;
    line-height: 1.4;
}

.video-card.active .thumbnail {
    outline: 3px solid #00aeec;
}

@media (max-width: 900px) {
    .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<header>▶ MY BILIBILI PLAYLIST</header>

<div class="container">

    <div class="player">
        <iframe
            id="mainPlayer"
            src="https://player.bilibili.com/player.html?isOutside=true&aid=117471969351524&bvid=BV143nw6KExV&cid=42898293026&p=1"
            scrolling="no"
            allowfullscreen="true">
        </iframe>
    </div>

    <h2>My Videos</h2>

    <div class="video-grid" id="videoGrid"></div>

</div>

<script>

    },
    {
        title: "Video 10",
        bvid: "",
        aid: "",
        cid: "",
        thumbnail:""
    }
];

const grid = document.getElementById("videoGrid");
const player = document.getElementById("mainPlayer");

function playVideo(index) {
    const video = videos[index];

    const url =
        `https://player.bilibili.com/player.html?isOutside=true` +
        `&aid=${video.aid}` +
        `&bvid=${video.bvid}` +
        `&cid=${video.cid}&p=1`;

    player.src = url;

    document.querySelectorAll(".video-card")
        .forEach(card => card.classList.remove("active"));

    document.querySelectorAll(".video-card")[index]
        .classList.add("active");
}

videos.forEach((video, index) => {
    const card = document.createElement("div");

    card.className = "video-card";
    card.tabIndex = 0;
    card.innerHTML = `
        <div class="thumbnail">
            <img
                src="${video.thumbnail || ''}"
                alt="${video.title}"
                referrerpolicy="no-referrer"
                onerror="this.style.display='none'"
            >
        </div>
        <div class="video-title">${video.title}</div>
    `;

    card.addEventListener("click", () => playVideo(index));

    card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            playVideo(index);
        }
    });

    grid.appendChild(card);
});

playVideo(0);
</script>

</body>
</html>
